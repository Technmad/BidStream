# Template only - do not commit real values. Create the actual Secret out-of-band (sealed-secrets,
# an external-secrets operator, or `kubectl create secret generic` from a local file) and apply it
# separately; this file documents the keys bidstream-config's envFrom expects alongside it.
apiVersion: v1
kind: Secret
metadata:
  name: bidstream-secrets
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: CHANGE_ME
  SPRING_DATASOURCE_PASSWORD: CHANGE_ME
  # Generate ONCE (e.g. `openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048` for the
  # private key, `openssl rsa -pubout` for the public key) and reuse across every replica and
  # every restart - JwtKeyConfig falls back to a per-instance ephemeral key pair when these are
  # absent, which breaks cross-pod token verification (docs/RUNBOOK.md's "known limitations").
  BIDSTREAM_JWT_PRIVATE_KEY_PEM: CHANGE_ME
  BIDSTREAM_JWT_PUBLIC_KEY_PEM: CHANGE_ME
  # PDR §17.1: names the exactly-one username that, if and when it registers, is granted
  # ROLE_ADMIN. Unset means no account can ever be promoted through this path - set it before
  # first deploy, register that username once, then treat it as a normal account afterwards
  # (this only fires inside register(), never on an existing account).
  BIDSTREAM_ADMIN_BOOTSTRAP_USERNAME: CHANGE_ME
