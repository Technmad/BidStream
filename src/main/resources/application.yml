spring:
  application:
    name: bidstream
  task:
    scheduling:
      pool:
        # Spring's @Scheduled default is a single-threaded pool - with the tick broadcaster
        # (~250ms), outbox relay (~500ms), and close-trigger scan (~5s) all competing for it,
        # one slow tick could starve the others indefinitely. Each gets its own thread.
        size: 4
  datasource:
    url: jdbc:postgresql://localhost:5433/bidstream
    username: bidstream
    password: bidstream
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: auction-processor
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.bidstream.adapter.messaging.dto
    listener:
      ack-mode: MANUAL

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    redis:
      enabled: true
    kafka:
      enabled: true
